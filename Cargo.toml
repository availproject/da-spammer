[package]
name = "da-spammer"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }

avail-fri = { git = "https://github.com/availproject/avail-core.git", rev = "df3ec48d0b86ad4e5a1607d4c4d128d7a2f641d2", default-features = false, features = ["parallel", "std"] }
avail-rust = { package = "avail-rust-client", git = "https://github.com/availproject/avail-rust.git", rev = "65b3d86c1f85e68387eeda8ae91cdcba9d2e2683", default-features = false, features = ["native", "reqwest"] }
# Substrate core bits needed for hashing / types
sp-crypto-hashing = { version = "0.1.0", default-features = false }

# SCALE Encode for signed extrinsic bytes
codec = { package = "parity-scale-codec", version = "3", default-features = false, features = ["std"] }

hex = "0.4"
base64 = { version = "0.22.1" }
rayon = "1.11.0"
parking_lot = "0.12.5"
num_cpus = "1.17.0"
ctrlc = "3.5.1"
